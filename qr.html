<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Desenergiza ou Morre</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0a0d12; --text: #e6edf3; --dim: #8b98a8; --yellow: #ffd400; --red: #ff3b30; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px 16px; text-align: center; }
    .wrap { max-width: 560px; width: 100%; }
    .hazard { height: 12px; border-radius: 3px; background: repeating-linear-gradient(-45deg, var(--yellow) 0 14px, #111 14px 28px); margin-bottom: 24px; }
    h1 { font-family: Oswald, Impact, sans-serif; font-size: clamp(40px, 10vw, 72px); line-height: .95; margin: 0 0 8px; text-transform: uppercase; }
    h1 span { color: var(--red); }
    p { color: var(--dim); font-size: 18px; margin: 0 0 24px; }
    .qr { background: #fff; border-radius: 20px; padding: 18px; display: inline-block; width: min(420px, 100%); }
    .qr img { width: 100%; height: auto; display: block; image-rendering: pixelated; }
    .url { font-family: ui-monospace, Menlo, monospace; font-size: 15px; color: var(--yellow); margin-top: 18px; word-break: break-all; }
    .print { margin-top: 22px; background: none; border: 1px solid #2f4057; color: var(--text); border-radius: 10px; padding: 10px 18px; font: inherit; cursor: pointer; }
    @media print {
      body { background: #fff; color: #000; }
      p, .url { color: #000; }
      .print { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hazard"></div>
    <h1>Desenergiza ou <span>Morre</span></h1>
    <p>Aponte a câmera do celular e jogue o treinamento NR-10 SEP</p>
    <div class="qr"><img src="img/qrcode.svg" alt="QR code para o jogo"></div>
    <div class="url">alexandrepiazza55rt.github.io/games_SIGMA</div>
    <button class="print" onclick="window.print()">🖨 Imprimir</button>
  </div>
</body>
</html>
